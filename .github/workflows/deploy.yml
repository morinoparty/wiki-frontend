# TanStack Start アプリを cf でビルドし、Worker "wiki-frontend" として deploy する。
#
# PR と main への push で build + dry-run を行い、main への push のときだけ本番 deploy する。
# PR では本番に deploy しない Worker Version を preview alias (pr-<番号>) 付きで upload し、
# その URL を PR にコメントする。
# 必要な secret:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  … cf CLI 用 (Worker には渡さない)
#   AUTH_SECRET, SERVER_URL, HAGAKI_GITHUB_TOKEN … Worker secret (--secrets-file で渡す)
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 本番 deploy (main への push) は固定のグループで直列化する。
  # PR / 手動実行は dry-run までなので ref ごとに分け、本番の待ち行列を押し出さない。
  group: ${{ github.event_name == 'push' && 'deploy-production' || format('deploy-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read
  # @morinoparty/chlorophyll-react を GitHub Packages から取得する
  packages: read
  # PR に preview の URL をコメントする
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v7

      # pnpm (package.json の packageManager) と Node (.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          cache: true      # pnpm store を lockfile ごとにキャッシュ
          install: false   # GitHub Packages の認証を install の前に挟むため

      # GitHub Packages の npm レジストリは公開パッケージでも認証が要る
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # prepare で panda codegen も走る
      - run: pnpm install --frozen-lockfile

      # cf build は package.json の scripts を通らないので、生成物は先に作る
      # (ライセンス一覧と、配信中の wiki-content から作る検索 index)
      - run: pnpm run generate

      - run: pnpm run typecheck

      # cf build は検出した vite build に --mode を渡せないので付けない
      - run: pnpm exec cf build

      - run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      # PR の preview。本番には deploy せず、Worker Version だけを upload して
      # preview alias (pr-<番号>) を付ける。secret は本番の Worker のものをそのまま引き継ぐ。
      # fork と Dependabot の PR には repository secrets が渡されないのでスキップする
      - if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        id: preview
        name: Upload preview version
        run: |
          set -o pipefail
          short_sha="${HEAD_SHA::8}"
          alias="pr-${PR_NUMBER}"
          # URL は 2 つ得られる。
          #   alias (pr-<番号>)          … その PR の最新 commit を指し続ける
          #   Version (<Version ID 8 桁>) … この upload に固定される
          # commit SHA は数字で始まることがあり、英小文字始まりが必要な alias には使えないため、
          # commit に固定した URL には Version の URL を使う
          # cf は upload 結果を ND-JSON で WRANGLER_OUTPUT_FILE_PATH に書き出す
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/cf-output.ndjson"
          pnpm exec cf workers versions create --prebuilt --mode production \
            --preview-alias "$alias" --tag "$alias" --message "PR #${PR_NUMBER} (${short_sha})"
          result="$(jq -c 'select(.type == "version-upload")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          printf '%s\n' "$result"
          {
            echo "short_sha=${short_sha}"
            echo "version_id=$(jq -r '.version_id // empty' <<<"$result")"
            echo "pr_url=$(jq -r '.preview_alias_url // empty' <<<"$result")"
            echo "version_url=$(jq -r '.preview_url // empty' <<<"$result")"
          } >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # push のたびにコメントを増やさないよう、前回のコメントを書き換える
      - if: steps.preview.outcome == 'success'
        name: Comment preview URL
        run: |
          {
            echo "## 🚀 Preview of ${REPO_NAME}"
            echo
            echo "| Resource | Link |"
            echo "|----------|------|"
            [ -n "$PR_URL" ] && echo "| 🌐 PR #${PR_NUMBER} (latest) | ${PR_URL} |"
            [ -n "$VERSION_URL" ] && echo "| 📌 Commit \`${SHORT_SHA}\` | ${VERSION_URL} |"
            echo
            echo "Worker Version: \`${VERSION_ID:-unknown}\`"
            echo
            echo "> 本番の Worker secret をそのまま使うため、preview からの保存も wiki-content にコミットされます。"
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHORT_SHA: ${{ steps.preview.outputs.short_sha }}
          VERSION_ID: ${{ steps.preview.outputs.version_id }}
          PR_URL: ${{ steps.preview.outputs.pr_url }}
          VERSION_URL: ${{ steps.preview.outputs.version_url }}

      # 本番 deploy は main への push のときだけ (push は branches: [main] に絞ってある)
      - if: github.event_name == 'push'
        name: Deploy to Cloudflare
        run: |
          # 空の secret で上書きしないよう、揃っていなければ止める
          : "${AUTH_SECRET:?}" "${SERVER_URL:?}" "${HAGAKI_GITHUB_TOKEN:?}"
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n \
            --arg AUTH_SECRET "$AUTH_SECRET" \
            --arg SERVER_URL "$SERVER_URL" \
            --arg HAGAKI_GITHUB_TOKEN "$HAGAKI_GITHUB_TOKEN" \
            '$ARGS.named' > "$secrets_file"
          pnpm exec cf deploy --prebuilt --mode production --secrets-file "$secrets_file"
          rm -f "$secrets_file"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          HAGAKI_GITHUB_TOKEN: ${{ secrets.HAGAKI_GITHUB_TOKEN }}
