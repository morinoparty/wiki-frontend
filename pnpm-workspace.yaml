allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  unrs-resolver: true
  es5-ext: false
  "@parcel/watcher": false

# panda の静的解析 (ts-evaluator) が、require を持たない環境で
# undefined.literal を読んで落ちるのを防ぐ。
patchedDependencies:
  ts-evaluator@1.2.0: patches/ts-evaluator@1.2.0.patch

minimumReleaseAgeExclude:
  - '@morinoparty/chlorophyll-react@0.4.11'
  - vinext@1.3.0
  - cf@1.0.0-beta.20
  - '@cloudflare/runtime-types@0.1.14'
  - miniflare@5.20261019.1-beta
  - '@morinoparty/hagaki@0.2.0 || 0.3.0'
